<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Activity Heatmap Card — Dev Harness</title>
    <style>
      :root {
        color-scheme: dark;
        --card-background-color: #1c1c1c;
        --primary-text-color: #e1e1e1;
        --secondary-text-color: #9b9b9b;
        --primary-color: #4da3ff;
      }
      :root[data-theme="light"] {
        color-scheme: light;
        --card-background-color: #ffffff;
        --primary-text-color: #212121;
        --secondary-text-color: #727272;
        --primary-color: #1a73c7;
      }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #0d0d0d;
        color: #ffffff;
        min-height: 100vh;
      }
      :root[data-theme="light"] body {
        background: #f9f9f7;
        color: #0b0b0b;
      }
      .toolbar {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        padding: 12px 20px;
        border-bottom: 1px solid rgba(128, 128, 128, 0.25);
      }
      .toolbar button {
        font: inherit;
        font-size: 13px;
        padding: 6px 12px;
        border-radius: 8px;
        border: 1px solid rgba(128, 128, 128, 0.4);
        background: transparent;
        color: inherit;
        cursor: pointer;
      }
      .toolbar button.on {
        border-color: #4da3ff;
        color: #4da3ff;
      }
      .toolbar h1 {
        font-size: 14px;
        font-weight: 600;
        margin: 0 0 4px;
        opacity: 0.7;
        flex-basis: 100%;
      }
      .toolbar .sep {
        width: 1px;
        height: 22px;
        background: rgba(128, 128, 128, 0.35);
      }
      .note {
        flex-basis: 100%;
        font-size: 11px;
        opacity: 0.45;
      }
      #app {
        max-width: 620px;
        margin: 24px auto;
        padding: 0 20px;
      }
      .narrow #app {
        max-width: 290px;
      }
      #editor-panel {
        max-width: 620px;
        margin: 0 auto 24px;
        padding: 0 20px;
        display: none;
      }
      #editor-panel.visible {
        display: block;
      }
      #editor-panel h2,
      #log-panel h2 {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        opacity: 0.6;
      }
      #config-dump {
        font-family: ui-monospace, monospace;
        font-size: 11px;
        white-space: pre-wrap;
        opacity: 0.7;
        max-height: 260px;
        overflow: auto;
        border: 1px solid rgba(128, 128, 128, 0.25);
        border-radius: 8px;
        padding: 8px;
      }
      #log-panel {
        max-width: 620px;
        margin: 0 auto 40px;
        padding: 0 20px;
      }
      #log {
        font-family: ui-monospace, monospace;
        font-size: 12px;
        opacity: 0.85;
        max-height: 170px;
        overflow-y: auto;
      }
      .log-line {
        padding: 2px 0;
      }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <h1>Activity Heatmap Card — Dev Harness</h1>
      <span id="demos"></span>
      <span class="sep"></span>
      <button id="palette-cycle">Palette: github</button>
      <button id="levels-cycle">Levels: 4</button>
      <button id="shape-cycle">Shape: square</button>
      <span class="sep"></span>
      <button id="stats-mode">Backend: full</button>
      <button id="fail-ws">Fail websocket</button>
      <button id="empty-data">Empty history</button>
      <button id="slow-ws">Slow (1.2s)</button>
      <span class="sep"></span>
      <button id="narrow-toggle">Narrow column</button>
      <button id="editor-toggle">Show editor</button>
      <button id="dark-toggle">☀ Light mode</button>
      <div class="note">
        Hover or focus the grid and use the arrow keys. prefers-reduced-motion can't be faked from
        page script — emulate it in DevTools (Rendering → Emulate CSS media feature) or via
        Playwright's emulateMedia.
      </div>
    </div>
    <div id="app"></div>
    <div id="editor-panel">
      <h2>Visual editor</h2>
      <div id="editor-host"></div>
      <h2>Resulting config</h2>
      <div id="config-dump"></div>
    </div>
    <div id="log-panel">
      <h2>Websocket calls</h2>
      <div id="log"></div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
