<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Schedule Timeline Card — Dev Harness</title>
    <style>
      /* This used to approximate the HA frontend's own custom properties,
         because the card's chrome was built on them. It is on M3 tokens now
         and reads only hass.themes.darkMode, so those variables are gone —
         leaving them would suggest the card still consumes them. The
         data-theme attribute below is the harness's own light/dark switch,
         and it drives the mock hass object, not the card's CSS directly. */
      :root {
        color-scheme: light;
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
      }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #f9f9f7;
        color: #0b0b0b;
        min-height: 100vh;
      }
      :root[data-theme="dark"] body {
        background: #0d0d0d;
        color: #ffffff;
      }
      .toolbar {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 20px;
        border-bottom: 1px solid rgba(128, 128, 128, 0.25);
      }
      .toolbar button {
        font: inherit;
        padding: 6px 12px;
        border-radius: 8px;
        border: 1px solid rgba(128, 128, 128, 0.4);
        background: transparent;
        color: inherit;
        cursor: pointer;
      }
      .toolbar h1 {
        font-size: 14px;
        font-weight: 600;
        margin: 0;
        margin-right: auto;
        opacity: 0.7;
      }
      #app {
        max-width: 900px;
        margin: 24px auto;
        padding: 0 20px;
      }
      #log-panel {
        max-width: 900px;
        margin: 0 auto 40px;
        padding: 0 20px;
      }
      #log-panel h2 {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        opacity: 0.6;
      }
      #log {
        font-family: ui-monospace, monospace;
        font-size: 12px;
        opacity: 0.85;
        max-height: 160px;
        overflow-y: auto;
      }
      .log-line {
        padding: 2px 0;
      }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <h1>Schedule Timeline Card — Dev Harness</h1>
      <button id="reset-filters">Reset filters</button>
      <button id="dark-toggle">🌙 Dark mode</button>
    </div>
    <div id="app"></div>
    <div id="log-panel">
      <h2>hass-more-info events (click a lane or block)</h2>
      <div id="log"></div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
